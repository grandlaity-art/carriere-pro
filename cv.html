<form method="POST"
      action="{{ url_for('mettre_a_jour_cv') }}"
      enctype="multipart/form-data">

    <label for="ancien_cv">
        Importer votre ancien CV (PDF ou photo)
    </label>

    <input
        type="file"
        id="ancien_cv"
        name="ancien_cv"
        accept=".pdf,.jpg,.jpeg,.png,.webp"
        required
    >

    <button type="submit">
        Mettre à jour mon CV
    </button>

</form>
